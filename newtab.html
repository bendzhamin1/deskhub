<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- заголовок как у нативной новой вкладки, чтобы не выбиваться из браузера;
       все data-i18n* переводит js/i18n.js -->
  <title data-i18n="pageTitle">New Tab</title>
  <!-- тема и направление текста до первой отрисовки (см. js/boot.js) -->
  <script src="js/boot.js"></script>
  <!-- Шрифт Inter вшит в пакет (см. @font-face в styles.css) — внешних загрузок нет -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!--
    Реализация дизайна "Стартовая страница.dc.html".
    Сетка и модальные окна заполняются из js/newtab.js по данным из storage.js.
  -->
  <div id="root" class="ntp-root">
    <!-- фоновые слои: градиент страницы + цветное свечение снизу -->
    <div class="ntp-bg"></div>
    <div class="ntp-glow"></div>

    <!-- кнопка настроек -->
    <button id="settingsBtn" class="ntp-icbtn ntp-settings-btn" aria-label="Settings" data-i18n-aria-label="settings" data-i18n-title="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.1"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <!-- центральная колонка -->
    <div class="ntp-center">
      <div class="ntp-stack">
        <!-- часы и дата (показываются по настройке) -->
        <div id="clock" class="ntp-clock" hidden>
          <div id="clockTime" class="ntp-clock-time">00:00</div>
          <div id="clockDate" class="ntp-clock-date"></div>
        </div>

        <!-- логотип DeskHub: векторный вордмарк, перекрашивается под тему
             (fill=currentColor), с прозрачностью через CSS (--logo-opacity) -->
        <div class="ntp-logo">
          <svg class="ntp-logo-img" viewBox="0 0 965.94 354.96" fill="currentColor" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DeskHub">
            <path fill-rule="nonzero" d="M637.14 0l0 117.72 -21.29 0 0 -117.72 -44.24 0 0 354.96 44.24 0 0 -192.64 21.29 0 0 192.64 44.24 0 0 -354.96 -44.24 0zm69.5 25.27l120.11 0 0 52.92 -120.11 0 0 -52.92zm-566.39 -1.43l406.1 0 0 55.42 -406.1 0 0 -55.42zm626.39 331.12c-16.17,0 -29.72,-5.24 -40.67,-16.05 -8.32,-8.21 -13.79,-17.24 -16.05,-27.47l-0.71 -2.5 0 -205.48 46.73 0 0 198.59c2.02,4.4 5.59,6.54 10.7,6.54 4.64,0 7.97,-1.07 9.75,-3.45 0.24,-0.71 0.59,-1.55 1.07,-2.38l0 -199.3 46.73 0 0 204.77 -0.36 1.78c-1.9,10.7 -6.88,20.23 -14.98,28.54 -10.92,11.19 -24.97,16.41 -42.22,16.41zm153.28 -51.97c-1.78,4.04 -5.23,5.95 -10.11,5.95 -5.71,0 -9.63,-1.9 -11.42,-5.95l0 -145.19c0.48,-1.19 0.83,-2.14 1.31,-2.85 2.38,-2.5 5.71,-3.81 10.11,-3.81 5.11,0 8.56,1.9 10.11,5.59l0 146.26zm-10.11 -198.11c-3.92,0 -7.73,0.24 -11.42,0.95l0 -105.83 -46.38 0 0 308.94 0.36 2.5c4.23,29.62 25.45,43.52 57.44,43.52 30.92,0 51.54,-13.9 55.77,-43.52l0.36 -2.5 0 -157.44 -0.36 -2.02c-5.35,-29.73 -23.9,-44.59 -55.77,-44.59zm-863.08 203.7c9.28,-0.48 15.46,-3.57 18.79,-9.4 1.78,-3.21 2.74,-6.18 2.74,-9.04l0 -227.48c-0.71,-10.94 -7.85,-16.77 -21.52,-17.36l0 263.28zm-46.73 46.38l0 -354.96 43.52 0c23.54,0 41.9,5.91 55.06,20.57 10.74,11.97 16.17,25.69 16.41,41.03l0 228.55c0,15.82 -5.25,30.05 -16.05,42.57 -13.1,15.19 -31.75,22.24 -55.41,22.24l-43.52 0zm189.55 -131.64c10.82,-2.14 18.08,-4.52 21.52,-7.37l0 -58.15c-2.02,-4.4 -5.95,-6.66 -11.42,-6.66 -4.28,0 -7.13,1.19 -8.8,3.45 -0.48,0.71 -0.83,1.55 -1.31,2.5l0 66.23zm10.11 131.64c-16.53,0 -30.07,-5.13 -40.79,-16.05 -8.19,-8.34 -13.44,-17.72 -15.7,-28.18l-0.36 -2.14 0 -156.73 0.36 -2.14c1.9,-10.58 6.9,-20.1 14.98,-28.54 10.7,-11.18 24.5,-16.65 41.5,-16.65 16.41,0 30.2,5.47 41.38,16.29 8.44,8.21 13.68,17.36 16.05,27.59l0.71 2.73 0 66.95c0,24.85 -17.48,41.26 -52.32,49.47 -5.11,1.07 -10.34,2.14 -15.94,3.09l0 32.11c1.55,3.92 5,5.83 10.11,5.83 5.71,0 9.63,-2.02 11.42,-6.18l0 -24.74 46.73 0 0 30.92 -0.36 2.14c-2.38,10.46 -7.49,19.98 -15.69,28.18 -11.06,11.06 -25.21,16.05 -42.1,16.05zm142.82 0c-16.53,0 -30.07,-5.13 -40.79,-16.05 -8.19,-8.34 -13.44,-17.72 -15.7,-28.18l-0.36 -2.5 0 -31.27 46.73 0 0 25.45c1.55,4.16 5,6.18 10.11,6.18 5.95,0 9.99,-2.02 11.77,-6.18l0 -25.81c0,-6.54 -9.75,-18.67 -29.25,-36.63 -26.28,-21.29 -39.36,-40.43 -39.36,-57.08l0 -31.39 0.36 -2.02c1.9,-10.46 6.9,-19.98 14.98,-28.66 10.7,-11.06 24.5,-16.65 41.5,-16.65 16.41,0 30.2,5.47 41.38,16.29 8.44,8.21 13.79,17.36 16.41,27.59l0.71 2.74 0 31.75 -46.73 0 0 -25.09c-2.02,-4.16 -6.06,-6.3 -11.77,-6.3 -4.28,0 -7.13,1.07 -8.8,3.21 -0.48,0.59 -0.83,1.43 -1.31,2.38l0 25.45c1.07,3.21 8.56,10.34 22.24,21.29 30.92,25.09 46.38,49.47 46.38,73.13l0 31.63 -0.71 2.5c-2.14,10.46 -7.32,19.91 -15.69,28.18 -11.13,10.99 -25.21,16.05 -42.1,16.05zm201.32 -86.09c-0.48,-19.98 -7.02,-36.74 -19.5,-50.42l1.43 -1.43c10.82,-10.46 16.29,-27.83 16.29,-51.97l0 -60.53 -46.26 0 0 60.53c0,11.89 -6.78,23.19 -20.22,33.89l0 -94.42 -46.73 0 0 250.43 46.73 0 0 -109.4 2.38 0c7.25,0 12.37,3.09 15.34,9.04 2.38,4.64 3.57,9.63 3.8,14.98l0 85.38 46.73 0 0 -86.09z"/>
          </svg>
        </div>

        <form id="searchForm" class="ntp-searchwrap" autocomplete="off">
          <div class="ntp-search">
            <input id="searchInput" class="ntp-search-input" placeholder="" data-i18n-placeholder="searchPlaceholder"
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
          </div>
          <!-- выпадающие подсказки (заполняются из newtab.js) -->
          <div id="suggest" class="ntp-suggest" hidden></div>
        </form>

        <div id="grid" class="ntp-grid"></div>
      </div>
    </div>

    <!-- слой для модалок (папка / настройки) рисуется из JS -->
    <div id="overlay"></div>
  </div>

  <script type="module" src="js/newtab.js"></script>
</body>
</html>
